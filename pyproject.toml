[project]
name = "meridian"
version = "0.1.0"
description = "MERIDIAN promotion-gated Indian market recommendation system"
requires-python = ">=3.11"
dependencies = [
  "duckdb",
  "pyarrow",
  "pandas",
  "numpy",
  "lightgbm",
  "scikit-learn",
  "fastapi",
  "pydantic",
  "pytest",
  "uvicorn>=0.52.1",
  "httpx2>=2.10.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

